name: Keep App Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours (UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Never let two pings overlap; a cold start can take a few minutes.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: write  # only for the heartbeat commit in the last job

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright==1.62.0
          playwright install --with-deps chromium

      - name: Open the app in a real browser
        env:
          APP_URL: https://fw-clt-prescreener-platform.streamlit.app/
          ARTIFACT_DIR: artifacts
          EXPECT_TEXT: Pre-Screener
        run: python .github/scripts/keep_awake.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # GitHub disables scheduled workflows after 60 days without repo activity, which
  # would silently kill the ping above. Refresh the clock as the deadline nears.
  heartbeat:
    needs: ping
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit a heartbeat if the last push is going stale
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit was $age_days days ago"
          if [ "$age_days" -lt 50 ]; then
            echo "recent enough - nothing to do"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore: keep-alive heartbeat [skip ci]"
          git push
